[project]
name = "blog-app"
version = "0.1.0"
description = "Simple Blog app to learn CRUD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.14",
    "django-environ>=0.14.0",
    "django-filter>=25.2",
    "djangorestframework>=3.17.1",
    "gunicorn>=26.0.0",
    "markdown>=3.10.2",
    "psycopg>=3.3.4",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.0.0",
]

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>{{post.title}}</h1>
    <p>{{post.body}}</p>
    <p>{{post.created_at}}</p>
    <form method="post">
        {% csrf_token %} 
        {{ form }}
        <button type="submit">submit</button>
    </form>
    {% for comment in comments %}
        <h4>{{ comment.name }}</h4>
        <p>{{ comment.text }}</p>
        <p>{{ comment.created_at }}</p>
    {% endfor %}
        

</body>
</html>
